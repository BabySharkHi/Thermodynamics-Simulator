<!DOCTYPE html>
<html>
    <head>
        <link rel = "stylesheet" href = "styles.css">
    </head>
    <body>
        <div id = "main-layout">
            <div id = "simulation-panel">
                <canvas id = "container"></canvas> 
                <div id = "heat-controls">
                    <img id = "fire" src="fire.png" alt="Heat">
                    <img id = "ice" scr="ice.png" alt="Cool">
                </div>
                <div class = "simulation-controls">
                    <button id = "pause-play-button">▶️</button>
                    <button id = "sim-speed-button">1x</button>
                </div>
                <p id = "sim-speed">1 Frame = 0.00001 seconds</p>
            </div>
            <div id = "control-panel">
                <div id="state-controls">
                    <div class="state-control">
                        <label for="temperature-slider">Temperature</label>
                        <input
                            id="temp-slider"
                            type="range"
                            min="1"
                            max="1000"
                            value="300"
                        >

                        <input
                            id="temp-number-input"
                            type="number"
                            min="1"
                            max="1000"
                            value="300"
                        >
                        <span> K</span>
                    </div>
                    <div class="state-control">
                        <label for="mole-slider">Number of Moles</label>
                        <input
                            id="mole-slider"
                            type="range"
                            min="0.01"
                            max="20"
                            value="2"
                            step="0.01"
                        >

                        <input
                            id="mole-number-input"
                            type="number"
                            min="0.01"
                            max="20"
                            value="2"
                            step="0.01"
                        >
                        <span> mol</span>
                    </div>
                
                    <div class="state-control">
                        <label for="width-slider">Container width</label>
                        <input
                            id="width-slider"
                            type="range"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="0"
                        >
                        <input
                            id="width-number-input"
                            type="number"
                            min="0.5"
                            max="2"
                            step = "0.01"
                            value="1.0"
                        >
                        <span> x</span>
                    </div>
                </div>
                <p id = "collisions">Number of collisions: 0</p>
                <p id = "impulse-per-collision">Impulse per collision: n/a</p>
                <p id = "pressure-equation">thoeutn</p>
            </div>
        </div>
        <div id = "graphs-panel">
            <section class = "graph-section">
                <button class="graph-toggle"
                        data-controls="velocity-graph-content">
                    <span>Show Velocity Distribution</span>
                    <span class="toggle-icon">+</span>
                </button>
                <div id = "velocity-graph-content">
                    <canvas id = "velocity-graph"></canvas>
                    <div class = "graph-options">
                        <label>
                            <input
                                type = "checkbox"
                                id = "show-rms"
                                checked
                            >
                        </label>

                        <label>
                            <input type="checkbox"
                                id = "show-mean"
                                checked
                            >
                        </label>

                        <label>
                            <input type="checkbox"
                                id = "show-mode"
                                checked
                            >
                        </label>
                    </div>
                </div>
            </section>
            <section class="graph-section">
                <button class="graph-toggle"
                        data-controls="pressure-graph-content"
                >
                    <span>Show Pressure History</span>
                    <span class="toggle-icon">+</span>
                </button>
                <div id="pressure-graph-content">
                    <canvas id = "pressure-chart"></canvas>
                </div>
            </section>
            <section class="graph-section">
                <button class="graph-toggle"
                        data-controls="PV-diagram-content">
                    <span>Show PV Diagram</span>
                    <span class="toggle-icon">+</span>
                </button>
                <div id = "PV-diagram-content">
                    <canvas id = "PV-diagram"></canvas>
                    <div class = "PV-diagram-controls">
                        <button id = "PV-pause-play">▶️</button>
                        <button id = "PV-clear">⏹️</button>
                    </div>
                </div>
            </section>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <script src = "script.js"></script>
    </body>
</html>
