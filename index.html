<!DOCTYPE html>
<html>
    <head>
        <link rel = "stylesheet" href = "styles.css">
    </head>
    <body>
        <div id = "main-layout">
            <div id = "simulation-panel">
                <p id = "sim-speed">1 Frame = 0.00001 seconds</p>
                <div class = "simulation-controls">
                    <button id = "pause-play-button">▶️</button>
                    <button id = "sim-speed-button">1x</button>
                </div>
                <canvas id = "container"></canvas> 
                <div id = "heat-controls">
                    <button id = "fire-button">
                        <img id = "fire" src="fire.png" alt="Hot">
                        <span id="fire-value" class="heat-control-value"></span>
                    </button>
                    <button id = "heater-button">
                        <img id = "heater" src="heater.png" alt = "Heat">
                        <span id="heater-value" class="heat-control-value"></span>
                    </button>
                    <button id = "fridge-button">
                        <img id = "fridge" src="refridgerator.png" alt = "Cool">
                        <span id="fridge-value" class="heat-control-value"></span>
                    </button>
                    <button id = "ice-button">
                        <img id = "ice" src="ice.png" alt="Cold">
                        <span id="ice-value" class="heat-control-value"></span>
                    </button>
                </div>
            </div>
            <div id = "control-panel">
                <section id="process-controls" aria-labelledby="process-controls-title">
                    <h2 id="process-controls-title">Run a Process</h2>
                    <div class="process-buttons">
                        <button class="process-button" data-process="isochoric">
                            Constant Volume
                        </button>
                        <button class="process-button" data-process="isobaric">
                            Constant Pressure
                        </button>
                        <button class="process-button" data-process="isothermal">
                            Constant Temperature
                        </button>
                        <button class="process-button" data-process="adiabatic">
                            Adiabatic
                        </button>
                    </div>
                    <p id="process-status" aria-live="polite">
                        No process running
                    </p>
                    <button id="end-process-button" disabled>End Process</button>
                </section>
                <div id="state-controls">
                    <div class="state-control">
                        <label for="temperature-slider">Temperature</label>
                        <input
                            id="temp-slider"
                            type="range"
                            min="1"
                            max="1000"
                            value="300"
                        >

                        <input
                            id="temp-number-input"
                            type="number"
                            min="1"
                            max="1000"
                            value="300"
                        >
                        <span> K</span>
                    </div>
                    <div class="state-control">
                        <label for="mole-slider">Number of Moles</label>
                        <input
                            id="mole-slider"
                            type="range"
                            min="0.01"
                            max="20"
                            value="2"
                            step="0.01"
                        >

                        <input
                            id="mole-number-input"
                            type="number"
                            min="0.01"
                            max="20"
                            value="2"
                            step="0.01"
                        >
                        <span> mol</span>
                    </div>
                
                    <div class="state-control">
                        <label for="width-slider">Container width</label>
                        <input
                            id="width-slider"
                            type="range"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="0"
                        >
                        <input
                            id="width-number-input"
                            type="number"
                            min="0.5"
                            max="2"
                            step = "0.01"
                            value="1.0"
                        >
                        <span> x</span>
                    </div>
                    <button 
                        id = "lock-wall-button"
                        data-controls="outside-pressure-controls"
                    >🔓</button>
                    <div id = "outside-pressure-controls" hidden>
                        <div class = "state-control">
                            <label for="outside-pressure-slider">Outside pressure</label>
                            <input
                                id="outside-pressure-slider"
                                type="range"
                                min="0"
                                max="30"
                                step="0.01"
                                value="1"
                            >
                            <input
                                id="outside-pressure-input"
                                type="number"
                                min="0"
                                max="300"
                                step="0.01"
                                value="1"
                            >
                            <span> atm</span>
                        </div>
                    </div>
                </div>
                <p id = "collisions">Number of collisions: 0</p>
                <p id = "impulse-per-collision">Impulse per collision: n/a</p>
                <p id = "pressure-equation"></p>
                <p id = "energy-equation"></p>
                <p id = "entropy-equation"></p>
            </div>
        </div>
        <div id = "graphs-panel">
            <section class = "graph-section">
                <button class="graph-toggle"
                        data-controls="velocity-graph-content">
                    <span>Show Velocity Distribution</span>
                    <span class="toggle-icon">+</span>
                </button>
                <div id = "velocity-graph-content">
                    <canvas id = "velocity-graph"></canvas>
                    <div class = "graph-options">
                        <label class="graph-option graph-option-rms">
                            <input
                                type = "checkbox"
                                id = "show-rms"
                                checked
                            >
                            <span>RMS</span>
                        </label>

                        <label class="graph-option graph-option-mean">
                            <input type="checkbox"
                                id = "show-mean"
                                checked
                            >
                            <span>Mean</span>
                        </label>

                        <label class="graph-option graph-option-mode">
                            <input type="checkbox"
                                id = "show-mode"
                                checked
                            >
                            <span>Mode</span>
                        </label>
                    </div>
                </div>
            </section>
            <section class="graph-section">
                <button class="graph-toggle"
                        data-controls="pressure-graph-content"
                >
                    <span>Show Pressure History</span>
                    <span class="toggle-icon">+</span>
                </button>
                <div id="pressure-graph-content">
                    <canvas id = "pressure-chart"></canvas>
                </div>
            </section>
            <section class="graph-section">
                <button class="graph-toggle"
                        data-controls="PV-diagram-content">
                    <span>Show PV Diagram</span>
                    <span class="toggle-icon">+</span>
                </button>
                <div id = "PV-diagram-content">
                    <canvas id = "PV-diagram"></canvas>
                    <div class = "PV-diagram-controls">
                        <button id = "PV-pause-play">▶️</button>
                        <button id = "PV-clear">⏹️</button>
                    </div>
                </div>
            </section>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <script src = "script.js"></script>
    </body>
</html>
