<!DOCTYPE html>
<html>
    <head>
        <link rel = "stylesheet" href = "styles.css">
    </head>
    <body>
        <div id = "main-layout">
            <div id = "simulation-panel">
                <canvas id = "container"></canvas> 
                <div class = "simulation-controls">
                    <button id = "pause-play-button">▶️</button>
                    <button id = "sim-speed-button">1x</button>
                </div>
                <p id = "sim-speed">1 Frame = 0.00001 seconds</p>
            </div>
            <div id = "control-panel">
                <div id="state-controls">
                    <div class="state-control">
                        <label for="temperature-slider">Temperature</label>
                        <input
                            id="temp-slider"
                            type="range"
                            min="1"
                            max="1000"
                            value="300"
                        >
                        
                        <input
                            id="temp-number-input"
                            type="number"
                            min="1"
                            max="1000"
                            value="300"
                        >
                        <span> K</span>
                    </div>
                    <div class="state-control">
                        <label for="mole-slider">Number of Moles</label>
                        <input
                            id="mole-slider"
                            type="range"
                            min="1"
                            max="2000"
                            value="200"
                        >

                        <input
                            id="mole-number-input"
                            type="number"
                            min="1"
                            max="2000"
                            value="200"
                        >
                        <span> mol</span>
                    </div>
                
                    <div class="state-control">
                        <label for="height-slider">Container height</label>
                        <input
                            id="height-slider"
                            type="range"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="0"
                        >
                        <input
                            id="height-number-input"
                            type="number"
                            min="0.5"
                            max="2"
                            step = "0.01"
                            value="1.0"
                        >
                        <span> x</span>
                    </div>
                </div>
                
                <p id ="temperature">Temperature: 0 K</p>
                <p id = "area">Area: 0.0 m</p>
                <p id = "pressure">BABY SHARK DOO DOO DOO DOO DOO DOO</p>
                <p id = "theoretical-pressure">YUMMY</p>
                <p id = "collisions">Number of collisions: 0</p>
                <p id = "impulse-per-collision">Impulse per collision: n/a</p>
                <p id = "molecule-count">Number of molecules: 0</p>
            <canvas id = "velocity-graph"></canvas>
            <canvas id = "PV-diagram"></canvas>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
        <script src = "script.js"></script>

    </body>
</html>
